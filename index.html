<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>爱回收 AI 对练</title>
<style>
/* ============================================================
   全局样式 & 变量
   ============================================================ */
:root {
  --c1:#00B578; --c2:#FF8F1F; --c3:#1677FF; --c4:#FF4D4F;
  --bg:#F5F5F5; --card:#FFF; --t1:#1A1A1A; --t2:#666; --t3:#999;
  --bd:#E8E8E8; --r:12px; --shadow:0 2px 12px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--t1);min-height:100vh;max-width:480px;margin:0 auto;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.screen{display:none;padding:16px;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* ============================================================
   按钮
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;
  border-radius:var(--r);padding:12px 24px;font-size:16px;font-weight:600;cursor:pointer;
  transition:all .2s;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.96);opacity:.85}
.btn-p{background:var(--c1);color:#FFF;width:100%}
.btn-s{background:var(--c3);color:#FFF}
.btn-o{background:#FFF;color:var(--t1);border:1px solid var(--bd)}
.btn-d{background:var(--c4);color:#FFF}
.btn:disabled{opacity:.5;pointer-events:none}

/* ============================================================
   欢迎页（名字输入）
   ============================================================ */
.welcome{justify-content:center;align-items:center;text-align:center;gap:32px}
.welcome .logo{font-size:64px;line-height:1}
.welcome h1{font-size:24px;font-weight:700}
.welcome p{color:var(--t2);font-size:14px;line-height:1.6}
.welcome .inp-wrap{width:100%;position:relative}
.welcome input{width:100%;padding:14px 16px;border:2px solid var(--bd);border-radius:var(--r);
  font-size:16px;outline:none;transition:border .2s;text-align:center}
.welcome input:focus{border-color:var(--c1)}

/* ============================================================
   主页（场景选择）
   ============================================================ */
.home-header{text-align:center;padding:12px 0 8px}
.home-header .greet{font-size:14px;color:var(--t2)}
.home-header .greet b{color:var(--c1);font-size:18px}
.home-header .sub{font-size:12px;color:var(--t3);margin-top:4px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;
  background:#FFF;color:var(--t2);border:1px solid var(--bd);transition:all .2s;flex-shrink:0}
.tab.on{background:var(--c1);color:#FFF;border-color:var(--c1)}
.tab .tab-emoji{font-size:16px;margin-right:2px}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0}
.scard{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;
  box-shadow:var(--shadow);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
.scard:active{transform:scale(.98);opacity:.85}
.scard .sc-emoji{font-size:36px;flex-shrink:0;width:48px;text-align:center}
.scard .sc-info{flex:1;min-width:0}
.scard .sc-name{font-size:15px;font-weight:600}
.scard .sc-desc{font-size:12px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sc-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
  background:#E8F8F0;color:var(--c1);margin-top:4px}
.scard .sc-arr{color:var(--t3);font-size:18px;flex-shrink:0}

.footer{text-align:center;padding:12px 0 4px;flex-shrink:0}
.footer .api-hint{font-size:11px;color:var(--t3);cursor:pointer;text-decoration:underline}
.footer .api-bar{display:none;margin-top:8px}
.footer .api-bar.show{display:flex;gap:8px}
.footer .api-bar input{flex:1;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;outline:none}
.footer .api-bar input:focus{border-color:var(--c1)}

/* ============================================================
   对话页
   ============================================================ */
.chat-top{display:flex;align-items:center;gap:10px;padding:8px 0 12px;border-bottom:1px solid var(--bd);flex-shrink:0}
.chat-top .back{font-size:22px;cursor:pointer;padding:4px;color:var(--t2);line-height:1}
.chat-top .sc-emoji-sm{font-size:28px}
.chat-top .sc-meta{flex:1;min-width:0}
.chat-top .sc-meta .sc-title{font-size:14px;font-weight:600}
.chat-top .sc-meta .sc-sub{font-size:11px;color:var(--t3)}
.chat-top .end-btn{padding:8px 16px;font-size:13px;border-radius:20px}

.msgs{flex:1;overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:8px;max-width:92%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:20px;flex-shrink:0;background:#F0F0F0}
.msg .bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word}
.msg.assistant .bubble{background:var(--card);border-top-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.msg.user .bubble{background:var(--c1);color:#FFF;border-top-right-radius:4px}
.msg .sys-tip{background:#FFFBE6;color:#AD8B00;padding:8px 12px;border-radius:8px;font-size:12px;margin:0 auto;text-align:center}

.chat-bar{display:flex;gap:8px;padding:10px 0;border-top:1px solid var(--bd);flex-shrink:0}
.chat-bar input{flex:1;padding:10px 14px;border:1px solid var(--bd);border-radius:20px;font-size:14px;outline:none}
.chat-bar input:focus{border-color:var(--c1)}
.chat-bar .send{width:40px;height:40px;border-radius:50%;border:none;background:var(--c1);color:#FFF;
  font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chat-bar .send:active{transform:scale(.9);opacity:.8}
.chat-bar .send:disabled{background:#CCC}
.chat-bar .mic{width:40px;height:40px;border-radius:50%;border:none;background:#FFF;color:var(--t2);
  font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chat-bar .mic:active{transform:scale(.9)}
.chat-bar .mic.rec{background:var(--c4);color:#FFF;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,79,.4)}50%{box-shadow:0 0 0 10px rgba(255,77,79,0)}}
.mic-tip{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);
  color:#FFF;padding:8px 20px;border-radius:20px;font-size:14px;z-index:50;display:none;max-width:90%}
.mic-tip.show{display:block}

/* ============================================================
   加载动画
   ============================================================ */
.loading-screen{position:fixed;top:0;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
  background:rgba(255,255,255,.95);z-index:100;display:none;flex-direction:column;
  justify-content:center;align-items:center;gap:20px}
.loading-screen.show{display:flex}
.spinner{width:48px;height:48px;border:4px solid var(--bd);border-top-color:var(--c1);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen .l-text{font-size:15px;color:var(--t2)}
.loading-screen .l-sub{font-size:12px;color:var(--t3)}

/* ============================================================
   报告页
   ============================================================ */
.report{padding:0}
.report .r-header{text-align:center;padding:24px 16px 20px;background:linear-gradient(135deg,#E8F8F0,#FFF)}
.report .r-header .r-emoji{font-size:56px;line-height:1.2}
.report .r-header .r-grade{font-size:36px;font-weight:800;margin:6px 0}
.report .r-header .r-grade.excellent{color:var(--c1)}
.report .r-header .r-grade.good{color:var(--c3)}
.report .r-header .r-grade.pass{color:var(--c2)}
.report .r-header .r-grade.fail{color:var(--c4)}
.report .r-header .r-sub{font-size:13px;color:var(--t2)}

.report .r-body{padding:16px}
.report .r-card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.report .r-card .r-card-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.report .r-score-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.report .r-score-row:last-child{margin-bottom:0}
.report .r-score-label{font-size:13px;width:52px;flex-shrink:0;color:var(--t2)}
.report .r-score-bar-wrap{flex:1;height:10px;background:#F0F0F0;border-radius:5px;overflow:hidden}
.report .r-score-bar{height:100%;border-radius:5px;transition:width .6s ease}
.report .r-score-bar.a{background:var(--c1)} .report .r-score-bar.b{background:var(--c3)}
.report .r-score-bar.c{background:var(--c2)} .report .r-score-bar.d{background:var(--c4)}
.report .r-score-val{font-size:14px;font-weight:700;width:36px;text-align:right;flex-shrink:0}
.report .r-comment{font-size:13px;color:var(--t2);line-height:1.6;padding:12px;background:#FAFAFA;border-radius:8px;margin-top:12px}
.report .r-flags{margin-top:12px}
.report .r-flag{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:6px;margin-bottom:6px}
.report .r-flag.red{background:#FFF1F0;color:var(--c4)}
.report .r-flag.yellow{background:#FFFBE6;color:#AD8B00}
.report .r-flag.green{background:#E8F8F0;color:var(--c1)}

.report .r-actions{display:flex;gap:10px;padding:8px 16px 24px}
.report .r-actions .btn{flex:1}

/* 保存 API Key 的小齿轮 */
.gear{position:absolute;top:12px;right:12px;font-size:18px;cursor:pointer;color:var(--t3);z-index:10}
.gear:active{opacity:.6}

/* 对话轮数指示 */
.round-badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:10px;background:#F0F0F0;color:var(--t3)}
.round-badge.warn{background:#FFF1F0;color:var(--c4)}
</style>
</head>
<body>

<!-- ============================================================
     欢迎页
     ============================================================ -->
<div id="welcome" class="screen active">
  <div class="welcome">
    <div class="logo">🤖</div>
    <h1>爱回收 AI 对练</h1>
    <p>模拟真实顾客对话，AI 自动评分<br>3C回收 · 严选销售 · 配件销售 · 延保销售</p>
    <div class="inp-wrap">
      <input id="nameInput" type="text" placeholder="请输入你的名字" maxlength="20" autocomplete="off">
    </div>
    <button class="btn btn-p" onclick="confirmName()">开始对练</button>
  </div>
</div>

<!-- ============================================================
     主页（场景选择）
     ============================================================ -->
<div id="home" class="screen">
  <div class="home-header">
    <div class="greet">👋 <b id="greetName"></b>，选择对练场景</div>
    <div class="sub">随机抽题，模拟真实顾客对话</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="scroll" id="scardList"></div>
  <div class="footer">
    <button class="btn btn-o" style="width:100%" onclick="randomScenario()">🎲 随机抽取一个场景</button>
  </div>
</div>

<!-- ============================================================
     对话页
     ============================================================ -->
<div id="chat" class="screen" style="padding-bottom:0">
  <div class="chat-top">
    <div class="back" onclick="backToHome()">←</div>
    <div class="sc-emoji-sm" id="chatEmoji"></div>
    <div class="sc-meta">
      <div class="sc-title" id="chatTitle"></div>
      <div class="sc-sub"><span id="chatCust"></span> · 轮数 <span id="roundCount" class="round-badge">0</span></div>
    </div>
    <button class="btn btn-d end-btn" onclick="endPractice()">结束对练</button>
  </div>
  <div class="msgs" id="msgList"></div>
  <div class="chat-bar">
    <input id="chatInput" type="text" placeholder="禁止粘贴，请打字或语音..." maxlength="500" autocomplete="off" onpaste="return false" ondrop="return false">
    <button class="mic" id="micBtn" onclick="toggleMic()" title="语音输入">🎤</button>
    <button class="send" id="sendBtn" onclick="sendMsg()">↑</button>
  </div>
  <div class="mic-tip" id="micTip">正在聆听...</div>
</div>

<!-- ============================================================
     加载遮罩
     ============================================================ -->
<div class="loading-screen" id="loading">
  <div class="spinner"></div>
  <div class="l-text" id="loadingText">AI 评估中...</div>
  <div class="l-sub">请稍候，正在分析对话表现</div>
</div>

<!-- ============================================================
     报告页
     ============================================================ -->
<div id="report" class="screen report"></div>

<script>
window.onerror=function(m,s,l,c,e){alert("JS Error: "+m+"\\nLine: "+l);return false};
/* ============================================================
   全局状态 S
   ============================================================ */
var S = {
  key: "",        // DeepSeek API Key
  name: "",       // 店员名字
  scenario: null, // 当前场景对象
  msgs: [],       // [{role:"user"|"assistant", content:"..."}]
  round: 0,       // 对话轮数（店员发言次数）
  score: null,    // 评估结果
  feishuHook: ""  // 飞书 Webhook 地址（可选）
};

/* ============================================================
   23个场景定义 SC
   id, emoji, name, desc, tag, cat, customerName, customerEmoji, script
   ============================================================ */
var SC = [
  // === 3C回收 (8个) ===
  {id:"sc_xianyu",emoji:"🐟",name:"闲鱼比价",desc:"顾客说闲鱼上能卖更高价",tag:"3C回收",cat:"3c",
   customerName:"小王",customerEmoji:"🙋",
   script:"你是一位年轻顾客，拿了一台iPhone 15 Pro来回收。你已经在闲鱼上查过价格，觉得爱回收的报价太低。你说闲鱼上同款能多卖500块，质疑爱回收的定价。你比较犹豫，既想省事又想多卖钱。拒绝两次后再考虑。"},
  {id:"sc_zhuanzhuan",emoji:"🔄",name:"转转比价",desc:"顾客拿转转APP报价来比较",tag:"3C回收",cat:"3c",
   customerName:"小李",customerEmoji:"👨",
   script:"你是一位中年男顾客，拿着手机给店员看转转APP上的报价，说转转回收价比爱回收高200多。你觉得都是回收平台，价格应该差不多。你比较在意这200块差价，但也不确定转转的报价是否靠谱。"},
  {id:"sc_compete",emoji:"🏪",name:"竞品到店比价",desc:"顾客刚从其他回收店过来比价",tag:"3C回收",cat:"3c",
   customerName:"老张",customerEmoji:"👴",
   script:"你是一位50多岁的顾客，刚从街对面的手机回收店过来，那家店报的价格比爱回收高150。你不太懂手机参数，就是觉得哪里便宜去哪里。你说那家店还送贴膜，问爱回收有没有什么赠品或优惠。"},
  {id:"sc_screen",emoji:"📱",name:"屏幕瑕疵",desc:"顾客不认可屏幕划痕扣款",tag:"3C回收",cat:"3c",
   customerName:"小陈",customerEmoji:"👩",
   script:"你拿来一台iPhone 14，屏幕上有几道细小划痕。店员说屏幕有划痕要扣80块，你觉得很不合理，因为日常使用根本看不出来。你觉得这是鸡蛋里挑骨头，故意压价。你情绪有点激动。"},
  {id:"sc_drop",emoji:"💥",name:"磕碰掉漆",desc:"顾客认为边框磕碰不影响使用",tag:"3C回收",cat:"3c",
   customerName:"阿强",customerEmoji:"💪",
   script:"你的手机边框有一处明显磕碰掉漆，但你一直戴壳使用，觉得不影响功能。店员说磕碰要扣120，你觉得太夸张了，手机功能完全正常。你说这种外观问题根本不影响二手销售。"},
  {id:"sc_lowprice",emoji:"📉",name:"价格太低",desc:"顾客对整体报价非常不满",tag:"3C回收",cat:"3c",
   customerName:"大刘",customerEmoji:"😤",
   script:"你拿来一台用了半年的安卓旗舰机，买的时候花了5000多。店员检测后报了1800的回收价，你非常震惊和不满，觉得贬值太快了。你质疑检测结果是否有问题，情绪比较激动但不失礼。"},
  {id:"sc_privacy",emoji:"🔒",name:"隐私安全",desc:"顾客担心数据泄露风险",tag:"3C回收",cat:"3c",
   customerName:"周姐",customerEmoji:"👩‍💼",
   script:"你是一位比较谨慎的女性顾客，准备回收旧手机但非常担心隐私泄露。你手机上有很多私人照片和工作文件，问店员数据清除是否真的安全。你说网上看到过数据被恢复的新闻，很担心。"},
  {id:"sc_leave",emoji:"🚶",name:"离店比价",desc:"顾客说再去别家看看再决定",tag:"3C回收",cat:"3c",
   customerName:"小赵",customerEmoji:"🧑",
   script:"你听完报价后觉得还行但不算特别满意，说想再去旁边商场里的回收店看看。你不是不想回收，就是想货比三家确认没被坑。你希望店员给你一个现在就成交的理由。"},

  // === 严选销售 (6个) ===
  {id:"sc_breakice",emoji:"🧊",name:"破冰搭话",desc:"顾客进店浏览，需要主动引导",tag:"严选销售",cat:"yx",
   customerName:"小周",customerEmoji:"👩",
   script:"你是一位在商场闲逛的女性顾客，路过店面时被橱窗展示吸引，进店随便看看。你不确定自己需要什么，只是觉得有些产品看起来不错。你有点社恐，不太会主动开口，需要店员引导才能聊起来。"},
  {id:"sc_need",emoji:"🔍",name:"挖掘需求",desc:"顾客需求模糊，需深度挖掘",tag:"严选销售",cat:"yx",
   customerName:"刘哥",customerEmoji:"🧔",
   script:"你进店说想看看手机，但不确定要买新的还是二手的。你的预算大概在3000左右，平时主要用手机拍照和看视频。你对手机参数不太了解，需要店员帮你分析比对。不要一上来就做决定。"},
  {id:"sc_compete2",emoji:"⚖",name:"比价异议",desc:"顾客说京东/拼多多更便宜",tag:"严选销售",cat:"yx",
   customerName:"小明",customerEmoji:"🧑‍🦱",
   script:"你看中了一台严选iPhone 14 Pro，但打开京东说上面同款便宜了300块。你觉得店里应该能比线上便宜才对，问店员为什么差价这么大。你确实想买，但不想多花冤枉钱。"},
  {id:"sc_price2",emoji:"💰",name:"价格异议",desc:"顾客觉得严选价格定位偏高",tag:"严选销售",cat:"yx",
   customerName:"老周",customerEmoji:"👨‍🦰",
   script:"你看了一圈觉得严选的品相不错，但价格比预期高了三四百。你说这些也就是二手手机，不理解为什么卖这么贵。你问了几个型号的价格都觉得偏高，有点想走了。"},
  {id:"sc_close",emoji:"🤝",name:"促单成交",desc:"顾客犹豫不决，需要促成下单",tag:"严选销售",cat:"yx",
   customerName:"小杨",customerEmoji:"👩‍🦰",
   script:"你已经看中一台手机，反复看了好几次，各方面都觉得满意，但就是下不了决心付款。你担心买回去发现问题，也担心售后没保障。你在纠结要不要今天就买。"},
  {id:"sc_after",emoji:"📞",name:"售后回访",desc:"老顾客来反馈使用中的小问题",tag:"严选销售",cat:"yx",

   ============================================================ */
function startPractice(id){
  if(!S.key){alert("请先设置 DeepSeek API Key（点击页面右上角 ⚙）");return}
  var sc=null;
  for(var i=0;i<SC.length;i++){if(SC[i].id===id){sc=SC[i];break}}
  if(!sc)return;
  S.scenario=sc;S.msgs=[];S.round=0;S.score=null;
  $("chatEmoji").textContent=sc.customerEmoji;
  $("chatTitle").textContent=sc.emoji+" "+sc.name;
  $("chatCust").textContent=sc.customerName+"（AI 顾客）";
  $("roundCount").textContent="0";
  $("roundCount").className="round-badge";
  $("msgList").innerHTML="";
  $("chatInput").value="";
  go("chat");
  $("chatInput").focus();

  // 添加系统开场提示
  addSysTip("场景："+sc.desc+"\n\n请向 "+sc.customerEmoji+" "+sc.customerName+" 发起对话");

  // AI 顾客不主动开口，等店员先说
}

function addSysTip(txt){
  $("msgList").innerHTML+='<div class="msg"><div class="sys-tip">'+escHtml(txt).replace(/\n/g,"<br>")+'</div></div>';
  scrollMsgs();
}

/* ============================================================
   发送消息 & AI对话
   ============================================================ */
function sendMsg(){
  if(!S.scenario)return;
  var input=$("chatInput"),txt=input.value.trim();
  if(!txt)return;
  // 禁用发送
  $("sendBtn").disabled=true;input.disabled=true;

  // 添加用户消息
  addMsg("user",txt);
  S.msgs.push({role:"user",content:txt});
  S.round++;
  $("roundCount").textContent=S.round;
  if(S.round<3) $("roundCount").className="round-badge warn";
  else $("roundCount").className="round-badge";
  input.value="";
  scrollMsgs();

  // 调 DeepSeek API 生成顾客回复
  callAI(S.msgs,false,function(reply){
    $("sendBtn").disabled=false;input.disabled=false;
    if(reply){
      addMsg("assistant",reply);
      S.msgs.push({role:"assistant",content:reply});
    } else {
      addSysTip("⚠ AI 顾客暂时不在线，请稍后再试");
    }
    scrollMsgs();
    input.focus();
  });
}

function addMsg(role,text){
  var avatar,cls=role;
  if(role==="user"){
    avatar=S.name.charAt(0)||"店";
  } else {
    avatar=S.scenario.customerEmoji;
  }
  $("msgList").innerHTML+='<div class="msg '+cls+'">'
    +'<div class="avatar">'+avatar+'</div>'
    +'<div class="bubble">'+escHtml(text)+'</div></div>';
}

function scrollMsgs(){
  var el=$("msgList");
  setTimeout(function(){el.scrollTop=el.scrollHeight},100);
}

/* ============================================================
   DeepSeek API 调用
   ============================================================ */
function callAI(msgs,isEval,callback){
  var sysPrompt;
  if(isEval){
    sysPrompt=buildEvalPrompt();
  } else {
    sysPrompt=buildCustomerPrompt();
  }
  var fullMsgs=[{role:"system",content:sysPrompt}].concat(msgs);

  var xhr=new XMLHttpRequest();
  xhr.open("POST","https://api.deepseek.com/chat/completions",true);
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.setRequestHeader("Authorization","Bearer "+S.key);
  xhr.timeout=30000;

  var timedOut=false;
  var timeoutId=setTimeout(function(){timedOut=true;xhr.abort();callback(null)},30000);

  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4)return;
    clearTimeout(timeoutId);
    if(timedOut)return;
    if(xhr.status===200){
      try{
        var resp=JSON.parse(xhr.responseText);
        var content=resp.choices&&resp.choices[0]&&resp.choices[0].message
          ?resp.choices[0].message.content:"";
        callback(content.trim());
      }catch(e){callback(null)}
    } else {
      var err="";
      try{err=JSON.parse(xhr.responseText).error.message||""}catch(e2){}
      console.error("API Error:",xhr.status,err);
      callback(null);
    }
  };

  var body=JSON.stringify({
    model:"deepseek-chat",
    messages:fullMsgs,
    temperature:isEval?0.3:0.8,
    max_tokens:isEval?1200:200
  });
  xhr.send(body);
}

    "店员主动说「回收价加一点，你买个配件/延保/严选」或以加价换购买 → 合规性0分",
    "注意：顾客自己主动提出要加钱、自己主动要买配件/延保，不算违规",
    "",
    "## 禁语（出现在对话中合规性不超过5分）",
    "「您去其他家看看」「标准就这样」「跟原装一样」「官方可查」",
    "",
    "## 等级",
    "≥95 优秀 / ≥90 良好 / ≥85 合格 / ＜85 加油",
    "",
    "## 输出格式（严格JSON）",
    "返回如下JSON，不要markdown代码块，只要纯JSON：",
    '{',
    '  "accuracy": 数字0-25,',
    '  "persuasion": 数字0-25,',
    '  "adaptability": 数字0-25,',
    '  "compliance": 数字0-25,',
    '  "total": 四项之和,',
    '  "grade": "excellent|good|pass|fail",',
    '  "summary": "30字以内的总评",',
    '  "strengths": ["亮点1","亮点2"],',
    '  "weaknesses": ["不足1","不足2"],',
    '  "suggestion": "1-2句改进建议",',
    '  "redline": true/false,',
    '  "forbidden": true/false',
    '}'
  ].join("\n");
}

/* ============================================================
   结束对练 & 评估
   ============================================================ */
function endPractice(){
  if(S.round<3){
    alert("对话轮数不足3轮，再多聊几句吧！\n（至少3轮对话才能触发AI评估）");
    return;
  }
  if(!confirm("确定结束对练吗？\n结束后将自动生成 AI 评估报告"))return;

  showLoading("AI 评估中...","正在分析你的对话表现");

  callAI(S.msgs,true,function(raw){
    hideLoading();
    var score=parseScore(raw);
    S.score=score;
    renderReport(score);
    go("report");
  });
}

function parseScore(raw){
  var defaults={
    accuracy:0,persuasion:0,adaptability:0,compliance:0,
    total:0,grade:"fail",summary:"评估解析失败，请重试",
    strengths:[],weaknesses:[],suggestion:"",redline:false,forbidden:false
  };
  try{
    var parsed=JSON.parse(raw);
    var score={
      accuracy:Math.max(0,Math.min(25,Number(parsed.accuracy)||0)),
      persuasion:Math.max(0,Math.min(25,Number(parsed.persuasion)||0)),
      adaptability:Math.max(0,Math.min(25,Number(parsed.adaptability)||0)),
      compliance:Math.max(0,Math.min(25,Number(parsed.compliance)||0)),
      total:0,grade:"fail",
      summary:parsed.summary||"",
      strengths:parsed.strengths||[],
      weaknesses:parsed.weaknesses||[],
      suggestion:parsed.suggestion||"",
      redline:!!parsed.redline,
      forbidden:!!parsed.forbidden
    };
    score.total=score.accuracy+score.persuasion+score.adaptability+score.compliance;
    if(score.total>=95)score.grade="excellent";
    else if(score.total>=90)score.grade="good";
    else if(score.total>=85)score.grade="pass";
    else score.grade="fail";
    return score;
  }catch(e){
    return defaults;
  }
}

/* ============================================================
   加载动画
   ============================================================ */
function showLoading(title,sub){
  $("loadingText").textContent=title;
  $("loading").querySelector(".l-sub").textContent=sub;
  $("loading").classList.add("show");
}
function hideLoading(){$("loading").classList.remove("show")}

/* ============================================================
   渲染报告
   ============================================================ */
function renderReport(sc){
  var gradeMap={excellent:"优秀",good:"良好",pass:"合格",fail:"加油"};
  var gradeClsMap={excellent:"excellent",good:"good",pass:"pass",fail:"fail"};
  var gradeEmoji={excellent:"🏆",good:"👍",pass:"💪",fail:"📚"};

  var dims=[
    {key:"accuracy",label:"准确性",barCls:"a"},
    {key:"persuasion",label:"说服力",barCls:"b"},
    {key:"adaptability",label:"应变力",barCls:"c"},
    {key:"compliance",label:"合规性",barCls:"d"}
  ];

  var scoresHtml="";
  dims.forEach(function(d){
    var v=sc[d.key];
    var pct=Math.round(v/25*100);
    scoresHtml+='<div class="r-score-row">'
      +'<div class="r-score-label">'+d.label+'</div>'
      +'<div class="r-score-bar-wrap"><div class="r-score-bar '+d.barCls+'" style="width:'+pct+'%"></div></div>'
      +'<div class="r-score-val">'+v+'</div></div>';
  });

  var flagsHtml="";
  if(sc.redline) flagsHtml+='<div class="r-flag red">🚫 触发合规红线 — 合规性0分</div>';
  if(sc.forbidden) flagsHtml+='<div class="r-flag yellow">⚠ 出现禁语 — 合规性不超过5分</div>';
  if(!sc.redline&&!sc.forbidden) flagsHtml+='<div class="r-flag green">✅ 未触发合规红线或禁语</div>';

  var sw=[];
  if(sc.strengths&&sc.strengths.length) sc.strengths.forEach(function(s){sw.push("✓ "+s)});
  if(sc.weaknesses&&sc.weaknesses.length) sc.weaknesses.forEach(function(w){sw.push("△ "+w)});

  $("report").innerHTML=''
    +'<div class="r-header">'
      +'<div class="r-emoji">'+gradeEmoji[sc.grade]+'</div>'
      +'<div class="r-grade '+gradeClsMap[sc.grade]+'">'+sc.total+'分</div>'
      +'<div class="r-sub">等级：'+gradeMap[sc.grade]+' · '+S.scenario.emoji+' '+S.scenario.name+'</div>'
      +'<div style="font-size:12px;color:var(--t3);margin-top:4px">'+fmtDate()+' · '+S.name+' · '+S.round+'轮对话</div>'
    +'</div>'
    +'<div class="r-body">'
      +'<div class="r-card">'
        +'<div class="r-card-title">📊 四维评估</div>'
        +scoresHtml
        +(sc.summary?'<div class="r-comment">💬 '+escHtml(sc.summary)+'</div>':'')
      +'</div>'
      +(sw.length?'<div class="r-card">'
        +'<div class="r-card-title">📝 评价详情</div>'
        +sw.map(function(s){return '<div style="font-size:13px;color:var(--t2);margin-bottom:4px">'+escHtml(s)+'</div>'}).join("")
      +'</div>':'')
      +(sc.suggestion?'<div class="r-card">'
        +'<div class="r-card-title">💡 改进建议</div>'
        +'<div style="font-size:13px;color:var(--t2);line-height:1.6">'+escHtml(sc.suggestion)+'</div>'
      +'</div>':'')
      +'<div class="r-card">'+flagsHtml+'</div>'
    +'</div>'
    +'<div class="r-actions">'
      +'<button class="btn btn-p" onclick="pushToFeishu()">📤 推送到飞书群</button>'
      +'<button class="btn btn-o" onclick="backToHome()">返回主页</button>'
    +'</div>';
}

/* ============================================================
   飞书推送
   ============================================================ */
function pushToFeishu(){
  if(!S.score){alert("没有评估数据");return}
  if(!S.feishuHook){alert("请先设置飞书 Webhook 地址\n\n点击页面右上角 ⚙ 图标进行设置");return}

  var sc=S.score;
  var gradeMap={excellent:"优秀",good:"良好",pass:"合格",fail:"加油"};
  var gradeColor={excellent:"green",good:"blue",pass:"orange",fail:"red"};
  var color=gradeColor[sc.grade]||"default";

  var body={
    msg_type:"interactive",
    card:{
      config:{wide_screen_mode:false},
      header:{title:{tag:"plain_text",content:"AI 对练报告 - "+escHtml(S.name)},template:color},
      elements:[
        {tag:"div",text:{tag:"lark_md",content:"**"+escHtml(S.name)+"**  "+S.scenario.emoji+" "+escHtml(S.scenario.name)+"  "+fmtDate()}},
        {tag:"hr"},
        {tag:"div",text:{tag:"lark_md",content:"**总分："+sc.total+"分**（"+gradeMap[sc.grade]+"）  "+S.round+"轮对话"}},
        {tag:"div",text:{tag:"lark_md",content:"准确性 "+sc.accuracy+" | 说服力 "+sc.persuasion+" | 应变力 "+sc.adaptability+" | 合规性 "+sc.compliance}},
        {tag:"hr"},
        {tag:"div",text:{tag:"lark_md",content:"💬 "+escHtml(sc.summary||"暂无评语")}}
      ]
    }
  };

  if(sc.suggestion){
    body.card.elements.push({tag:"div",text:{tag:"lark_md",content:"💡 **改进建议**\n"+escHtml(sc.suggestion)}});
  }
  if(sc.redline){
    body.card.elements.push({tag:"div",text:{tag:"lark_md",content:"🚫 **触发合规红线**"}});
  }
  if(sc.forbidden){
    body.card.elements.push({tag:"div",text:{tag:"lark_md",content:"⚠ **出现禁语**"}});
  }
  body.card.elements.push({tag:"hr"});
  body.card.elements.push({tag:"note",elements:[{tag:"plain_text",content:"爱回收 AI 对练 - 自动评估"}]});

  showLoading("推送中...","正在发送报告到飞书群");

  // 直接调用飞书 Webhook（支持 CORS）
  var xhr=new XMLHttpRequest();
  xhr.open("POST",S.feishuHook,true);
  xhr.setRequestHeader("Content-Type","application/json; charset=utf-8");
  xhr.timeout=15000;

  var timedOut=false;
  var tid=setTimeout(function(){timedOut=true;xhr.abort();hideLoading();alert("推送超时，请检查网络或 Webhook 地址")},15000);

  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4)return;
    clearTimeout(tid);
    hideLoading();
    if(timedOut)return;
    if(xhr.status===200){
      try{
        var r=JSON.parse(xhr.responseText);
        if(r.code===0||r.StatusCode===0)alert("✅ 已推送到飞书群！");
        else alert("推送返回异常："+JSON.stringify(r).substring(0,100));
      }catch(e){alert("✅ 推送完成")}
    } else {
      alert("推送失败（HTTP "+xhr.status+"）\n请检查 Webhook 地址是否正确");
    }
  };

  xhr.send(JSON.stringify(body));
}

/* ============================================================
   返回主页
   ============================================================ */
function backToHome(){
  S.scenario=null;S.msgs=[];S.round=0;S.score=null;
  go("home");
}

/* ============================================================
   语音输入
   ============================================================ */
var recognition=null,isRecording=false;
function toggleMic(){isRecording?stopMic():startMic()}
function startMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("当前浏览器不支持语音输入，请使用 Chrome/Edge 或飞书内打开");return}
  if(!recognition){
    recognition=new SR();recognition.lang="zh-CN";recognition.interimResults=true;recognition.continuous=true;
    recognition.onresult=function(e){
      var t="";for(var i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;
      $("chatInput").value=t;$("chatInput").focus();
      if(e.results[e.results.length-1].isFinal){$("micTip").classList.remove("show")}
      else{$("micTip").textContent=t||"正在聆听...";$("micTip").classList.add("show")}
    };
    recognition.onerror=function(e){stopMic();$("micTip").classList.remove("show");if(e.error==="not-allowed")alert("请允许麦克风权限")};
    recognition.onend=function(){stopMic()};
  }
  try{isRecording=true;$("micBtn").classList.add("rec");$("micBtn").textContent="⏹";$("micTip").textContent="正在聆听...";$("micTip").classList.add("show");recognition.start()}catch(e){stopMic()}
}
function stopMic(){
  isRecording=false;$("micBtn").classList.remove("rec");$("micBtn").textContent="🎤";$("micTip").classList.remove("show");
  if(recognition)try{recognition.stop()}catch(e){}
}

/* ============================================================
   键盘事件 & 防粘贴
   ============================================================ */
document.addEventListener("keydown",function(e){
  if(e.target&&e.target.id==="chatInput"){
    if((e.ctrlKey||e.metaKey)&&e.key==="v"){e.preventDefault();return}
    if(e.shiftKey&&e.key==="Insert"){e.preventDefault();return}
  }
  if(e.key==="Enter"){
    var ws=document.querySelector(".screen.active");
    if(!ws)return;
    if(ws.id==="welcome"){confirmName()}
    else if(ws.id==="chat"){sendMsg()}
  }
});
document.addEventListener("contextmenu",function(e){
  if(e.target&&e.target.id==="chatInput"){e.preventDefault()}
});

/* ============================================================
   启动
   ============================================================ */
try{init()}catch(e){alert("Init Error: "+e.message+"\\nLine: "+(e.lineNumber||""))};
